              private boolean isNight() {
                  return (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK)
                          == Configuration.UI_MODE_NIGHT_YES;
              }

              private int dp(float v) {
                  return Math.round(TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, getResources().getDisplayMetrics()));
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  live = getIntent().getBooleanExtra("live", false);
                  daily = getIntent().getBooleanExtra("daily", false);
                  long rideId = getIntent().getLongExtra("rideId", 0L);
                  if (live) ruta = Datos.rutaActual(this);
                  else if (daily) ruta = Datos.rutaDiaria(this);
                  else ruta = Datos.rutaFile(this, rideId);

                  boolean night = isNight();
                  int bg = Color.parseColor(night ? "#0A0A0A" : "#F4F4F4");
                  int surface = Color.parseColor(night ? "#151515" : "#FFFFFF");
                  int ink = Color.parseColor(night ? "#F2F2F2" : "#111111");
                  int muted = Color.parseColor(night ? "#8C8C8C" : "#6E6E6E");
                  int line = Color.parseColor(night ? "#2B2B2B" : "#E1E1E1");
