                          Intent mi = new Intent(this, MapaActivity.class);
                          mi.putExtra("live", true);
                          startActivity(mi);
                      });
                      rec.addView(mapBtn, lp(-1, dp(48), 10));
                  }
                  content.addView(rec, lp(-1, -2, 18));

                  // Ruta diaria guardada (el mapa funciona sin internet)
                  if (Datos.rutaDiaria(this).exists()) {
                      LinearLayout dc = card();
                      dc.addView(text("Mi ruta diaria", 16, ink, true));
                      dc.addView(text(MapCache.info(this) + "  ·  funciona sin internet", 13, muted, false), lp(-1, -2, 2));
                      Button vb = outlineButton("Ver mapa");
                      vb.setOnClickListener(v -> {
                          Intent mi = new Intent(this, MapaActivity.class);
                          mi.putExtra("daily", true);
                          startActivity(mi);
                      });
                      dc.addView(vb, lp(-1, dp(46), 12));
                      content.addView(dc, lp(-1, -2, 12));
                  }

                  // Historial
                  sectionHeader("Recorridos", "+ A mano", () -> rideDialog(null));
                  if (rides.isEmpty()) {
                      content.addView(emptyCard("Aún no hay recorridos",
                              "Inicia uno con el GPS o agrega los km a mano con \"+ A mano\"."), lp(-1, -2, 8));
                  } else {
                      int max = showAllRides ? rides.size() : Math.min(8, rides.size());
                      for (int i = 0; i < max; i++) content.addView(rideCard(rides.get(i)), lp(-1, -2, 8));
                      if (rides.size() > 8) {
                          TextView tg = text(showAllRides ? "Ver menos" : "Ver todos (" + rides.size() + ")", 14, muted, true);
                          tg.setPadding(0, dp(12), 0, dp(4));
                          tg.setOnClickListener(v -> {
                              showAllRides = !showAllRides;
                              render();
                          });
                          content.addView(tg, lp(-1, -2, 6));
                      }
                  }

                  // Km iniciales
                  sectionHeader("Ajustes", null, null);
                  LinearLayout base = card();
                  base.addView(text("Km iniciales de la patineta", 15, ink, true));
                  base.addView(text(Datos.km1(Datos.baseKm(this)) + " km  ·  toca para cambiar", 13, muted, false), lp(-1, -2, 2));
                  base.setOnClickListener(v -> baseDialog());
                  content.addView(base, lp(-1, -2, 8));
              }

              private View rideCard(Datos.Ride r) {
                  LinearLayout c = card();
                  c.setOrientation(LinearLayout.HORIZONTAL);
                  c.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout left = new LinearLayout(this);
                  left.setOrientation(LinearLayout.VERTICAL);
                  left.addView(text(Datos.fechaHora(r.start), 15, ink, true));
                  String meta;
                  if (r.durMs > 0) {
                      meta = Datos.dur(r.durMs) + "  ·  " + Datos.km1(r.km / (r.durMs / 3600000.0)) + " km/h";
                  } else {
                      meta = r.manual ? "Agregado a mano" : "Sin tiempo";
                  }
                  if (r.durMs > 0 && r.manual) meta += "  ·  a mano";
                  left.addView(text(meta, 13, muted, false), lp(-1, -2, 2));
                  c.addView(left, new LinearLayout.LayoutParams(0, -2, 1f));
                  if (Datos.rutaFile(this, r.id).exists()) {
                      TextView mp = pill("Mapa", false);
                      mp.setPadding(dp(12), dp(6), dp(12), dp(6));
                      mp.setOnClickListener(v -> {
                          Intent mi = new Intent(this, MapaActivity.class);
                          mi.putExtra("rideId", r.id);
                          startActivity(mi);
                      });
                      LinearLayout.LayoutParams mpp = new LinearLayout.LayoutParams(-2, -2);
                      mpp.rightMargin = dp(12);
                      c.addView(mp, mpp);
                  }
                  c.addView(text(Datos.km2(r.km) + " km", 17, ink, true));
                  c.setOnClickListener(v -> rideDialog(r));
                  return c;
              }

              // ------------------------------------------------------------------ Iniciar / pausar / terminar
              private void startRide(String action) {
                  if (checkSelfPermission(FINE) != PackageManager.PERMISSION_GRANTED) {
                      pendingStart = true;
                      pendingAction = action;
                      String[] perms = Build.VERSION.SDK_INT >= 33
                              ? new String[]{FINE, COARSE, NOTIF} : new String[]{FINE, COARSE};
                      requestPermissions(perms, 10);
                      return;
                  }
                  LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  if (lm == null || !lm.isProviderEnabled(LocationManager.GPS_PROVIDER)) {
                      Toast.makeText(this, "Activa la ubicación (GPS) del celular para medir los km", Toast.LENGTH_LONG).show();
                      try {
                          startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS));
                      } catch (Exception ignored) { }
                      return;
                  }
                  sendToService(action, true);
              }

              private void sendToService(String action, boolean foreground) {
                  Intent i = new Intent(this, TrackService.class);
                  i.setAction(action);
                  if (foreground) startForegroundService(i);
                  else startService(i);
              }

              private void confirmFinish() {
                  double km = TrackService.meters / 1000.0;
                  new AlertDialog.Builder(this)
                          .setTitle("¿Terminar el recorrido?")
                          .setMessage("Se guardarán " + Datos.km2(km) + " km en " + Datos.dur(TrackService.activeNow()) + ".")
                          .setPositiveButton("Terminar", (d, w) -> sendToService(TrackService.ACT_FINISH, false))
                          .setNegativeButton("Seguir", null)
                          .show();
              }

              // ------------------------------------------------------------------ Pestaña Taller
              private void renderTaller() {
                  header("Taller");
                  double odo = odoNow();

                  sectionHeader("Avisos por km", "+ Nuevo", () -> avisoDialog(null));
                  List<Datos.Aviso> avisos = Datos.loadAvisos(this);
                  Collections.sort(avisos, (a, b) -> Double.compare(Datos.falta(a, odo), Datos.falta(b, odo)));
                  if (avisos.isEmpty()) {
                      content.addView(emptyCard("Sin avisos todavía",
                              "Crea uno por cada pieza o tarea. Ej.: Frenos cada 300 km, Revisión en taller cada 1.000 km. La app te avisa cuando se acerque."),
                              lp(-1, -2, 8));
                  } else {
                      for (Datos.Aviso a : avisos) content.addView(avisoCard(a, odo), lp(-1, -2, 8));
                  }

                  sectionHeader("Bitácora", "+ Anotación", () -> entryDialog(null, 0));
                  List<Datos.Entry> entries = Datos.loadEntries(this);
                  Collections.sort(entries, (a, b) -> Long.compare(b.date, a.date));
                  if (entries.isEmpty()) {
                      content.addView(emptyCard("Bitácora vacía",
                              "Anota reparaciones, cambios de piezas, compras o lo que le hagas a la patineta, con la fecha y los km."),
                              lp(-1, -2, 8));
                  } else {
                      for (Datos.Entry e : entries) content.addView(entryCard(e), lp(-1, -2, 8));
                  }
              }

              private View avisoCard(Datos.Aviso a, double odo) {
                  int lv = Datos.nivel(a, odo);
                  double falta = Datos.falta(a, odo);
                  double used = odo - a.ultimoKm;
                  double frac = a.cadaKm > 0 ? Math.max(0, Math.min(1, used / a.cadaKm)) : 0;

                  LinearLayout c = card();
                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.addView(text(a.nombre, 16, ink, true), new LinearLayout.LayoutParams(0, -2, 1f));
                  if (lv == 2) top.addView(pill("Toca", true));
                  else if (lv == 1) top.addView(pill("Pronto", false));
                  c.addView(top);
                  c.addView(text("Cada " + Datos.km1(a.cadaKm) + " km  ·  último servicio a los " + Datos.km1(a.ultimoKm) + " km",
                          13, muted, false), lp(-1, -2, 4));

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setBackground(box(line, 0, 3));
                  View fill = new View(this);
                  fill.setBackground(box(ink, 0, 3));
                  bar.addView(fill, new LinearLayout.LayoutParams(0, -1, (float) frac));
                  bar.addView(new View(this), new LinearLayout.LayoutParams(0, -1, (float) (1 - frac)));
                  c.addView(bar, lp(-1, dp(6), 12));

                  LinearLayout bottom = new LinearLayout(this);
                  bottom.setOrientation(LinearLayout.HORIZONTAL);
                  bottom.setGravity(Gravity.CENTER_VERTICAL);
                  String s = falta > 0 ? "Faltan " + Datos.km1(falta) + " km" : "Se pasó por " + Datos.km1(-falta) + " km";
                  bottom.addView(text(s, 14, ink, true), new LinearLayout.LayoutParams(0, -2, 1f));
                  Button done = outlineButton("Hecho");
                  done.setMinHeight(0);
                  done.setMinimumHeight(0);
                  done.setPadding(dp(16), dp(6), dp(16), dp(6));
                  done.setOnClickListener(v -> avisoHecho(a));
                  bottom.addView(done, new LinearLayout.LayoutParams(-2, dp(38)));
                  c.addView(bottom, lp(-1, -2, 8));

                  c.setOnClickListener(v -> avisoDialog(a));
                  return c;
              }

              private View entryCard(Datos.Entry e) {
                  LinearLayout c = card();
                  LinearLayout top = new LinearLayout(this);
                  top.setOrientation(LinearLayout.HORIZONTAL);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.addView(text(e.titulo, 16, ink, true), new LinearLayout.LayoutParams(0, -2, 1f));
                  LinearLayout.LayoutParams pp = new LinearLayout.LayoutParams(-2, -2);
                  pp.leftMargin = dp(8);
                  top.addView(pill(Datos.TIPOS[e.tipo], false), pp);
                  c.addView(top);
                  String meta = Datos.fecha(e.date) + (e.km > 0 ? "  ·  a los " + Datos.km1(e.km) + " km" : "");
                  c.addView(text(meta, 13, muted, false), lp(-1, -2, 4));
                  if (!e.notas.isEmpty()) {
                      TextView n = text(e.notas, 14, ink, false);
                      n.setMaxLines(3);
                      n.setEllipsize(TextUtils.TruncateAt.END);
                      c.addView(n, lp(-1, -2, 6));
                  }
                  if (e.costo > 0) c.addView(text(Datos.money(e.costo), 15, ink, true), lp(-1, -2, 6));
                  c.setOnClickListener(v -> entryDialog(e, e.tipo));
                  return c;
              }

              // ------------------------------------------------------------------ Pestaña Gastos
              private void renderGastos() {
                  header("Gastos");
                  List<Datos.Entry> all = Datos.loadEntries(this);
                  List<Datos.Entry> gastos = new ArrayList<>();
                  double total = 0, mes = 0, anio = 0;
                  double[] porTipo = new double[Datos.TIPOS.length];
                  long mo = Datos.inicioMes(), yr = Datos.inicioAnio();
                  for (Datos.Entry e : all) {
                      if (e.costo <= 0) continue;
                      gastos.add(e);
                      total += e.costo;
                      porTipo[e.tipo] += e.costo;
                      if (e.date >= mo) mes += e.costo;
                      if (e.date >= yr) anio += e.costo;
                  }
                  Collections.sort(gastos, (a, b) -> Long.compare(b.date, a.date));

                  content.addView(caps("Total gastado"), lp(-1, -2, 22));
                  content.addView(text(Datos.money(total), 40, ink, true), lp(-1, -2, 2));

                  double recorridos = Datos.odometer(this) - Datos.baseKm(this);
                  LinearLayout stats = new LinearLayout(this);
                  stats.setOrientation(LinearLayout.HORIZONTAL);
                  addStat(stats, Datos.money(mes), "este mes");
                  addStat(stats, Datos.money(anio), "este año");
                  addStat(stats, recorridos >= 1 && total > 0 ? Datos.money(total / recorridos) : "–", "por km");
                  content.addView(stats, lp(-1, -2, 14));

                  if (total > 0) {
                      sectionHeader("Por tipo", null, null);
                      LinearLayout box = card();
                      boolean first = true;
                      for (int i = 0; i < porTipo.length; i++) {
                          if (porTipo[i] <= 0) continue;
                          LinearLayout r = new LinearLayout(this);
                          r.setOrientation(LinearLayout.HORIZONTAL);
                          r.addView(text(Datos.TIPOS[i], 14, ink, false), new LinearLayout.LayoutParams(0, -2, 1f));
                          r.addView(text(Datos.money(porTipo[i]), 14, ink, true));
                          box.addView(r, lp(-1, -2, first ? 0 : 10));
                          double frac = porTipo[i] / total;
                          LinearLayout bar = new LinearLayout(this);
                          bar.setOrientation(LinearLayout.HORIZONTAL);
                          bar.setBackground(box(line, 0, 2));
                          View fill = new View(this);
                          fill.setBackground(box(ink, 0, 2));
                          bar.addView(fill, new LinearLayout.LayoutParams(0, -1, (float) frac));
                          bar.addView(new View(this), new LinearLayout.LayoutParams(0, -1, (float) (1 - frac)));
                          box.addView(bar, lp(-1, dp(4), 6));
                          first = false;
                      }
                      content.addView(box, lp(-1, -2, 8));
                  }

                  sectionHeader("Movimientos", "+ Nuevo gasto", () -> entryDialog(null, 3));
                  if (gastos.isEmpty()) {
                      content.addView(emptyCard("Sin gastos todavía",
                              "Anota lo que compras o pagas por la patineta. Toda anotación con costo aparece aquí."),
                              lp(-1, -2, 8));
                  } else {
                      for (Datos.Entry e : gastos) content.addView(entryCard(e), lp(-1, -2, 8));
                  }
              }

              // ------------------------------------------------------------------ Diálogos
              private LinearLayout dialogBox() {
                  LinearLayout v = new LinearLayout(this);
                  v.setOrientation(LinearLayout.VERTICAL);
                  v.setPadding(dp(22), dp(10), dp(22), dp(6));
                  return v;
              }

              private TextView label(String s) {
                  TextView t = text(s, 13, muted, true);
                  t.setPadding(0, dp(14), 0, dp(2));
                  return t;
              }

              private EditText field(String hint, String value, int type) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setInputType(type);
                  e.setText(value);
                  return e;
              }

              private Button dateButton(Calendar cal) {
                  Button b = outlineButton(Datos.fechaLarga(cal.getTimeInMillis()));
                  b.setOnClickListener(x -> new DatePickerDialog(this, (dp, y, m, d) -> {
                      cal.set(y, m, d);
                      b.setText(Datos.fechaLarga(cal.getTimeInMillis()));
                  }, cal.get(Calendar.YEAR), cal.get(Calendar.MONTH), cal.get(Calendar.DAY_OF_MONTH)).show());
                  return b;
              }

              private static final int DECIMAL = InputType.TYPE_CLASS_NUMBER | InputType.TYPE_NUMBER_FLAG_DECIMAL;
              private static final int ENTERO = InputType.TYPE_CLASS_NUMBER;
              private static final int TEXTO = InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_SENTENCES;

              private void confirmDelete(String title, String msg, Runnable onYes) {
                  new AlertDialog.Builder(this)
                          .setTitle(title)
                          .setMessage(msg + "\n\nNo se puede deshacer.")
                          .setPositiveButton("Eliminar", (a, w) -> onYes.run())
                          .setNegativeButton("Cancelar", null)
                          .show();
              }

              /** Agregar un recorrido a mano o corregir uno existente. */
              private void rideDialog(Datos.Ride existing) {
                  final boolean editing = existing != null;
                  final Calendar cal = Calendar.getInstance();
                  if (editing) cal.setTimeInMillis(existing.start);

                  LinearLayout v = dialogBox();
                  v.addView(label("Fecha"));
                  v.addView(dateButton(cal));
                  v.addView(label("Kilómetros"));
                  EditText kmF = field("Ej.: 8,5", editing ? Datos.campo(existing.km) : "", DECIMAL);
                  v.addView(kmF);
                  v.addView(label("Duración en minutos (opcional)"));
                  final String origMin = editing && existing.durMs > 0 ? String.valueOf(existing.durMs / 60000) : "";
                  EditText minF = field("Ej.: 35", origMin, ENTERO);
                  v.addView(minF);

                  ScrollView sv = new ScrollView(this);
                  sv.addView(v);
                  AlertDialog.Builder b = new AlertDialog.Builder(this)
                          .setTitle(editing ? "Editar recorrido" : "Agregar recorrido a mano")
                          .setView(sv)
                          .setPositiveButton("Guardar", null)
                          .setNegativeButton("Cancelar", null);
                  if (editing) b.setNeutralButton("Eliminar", null);
                  AlertDialog d = b.create();
                  d.setOnShowListener(x -> {
                      d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(y -> {
                          double km = Datos.num(kmF.getText().toString());
                          if (km <= 0) {
                              kmF.setError("Escribe los km");
                              return;
                          }
                          Datos.Ride r = editing ? existing : new Datos.Ride();
                          if (!editing) {
                              r.id = System.currentTimeMillis();
                              r.manual = true;
                          }
                          r.start = cal.getTimeInMillis();
                          r.km = km;
                          String mins = minF.getText().toString().trim();
                          if (!(editing && mins.equals(origMin))) r.durMs = (long) Datos.num(mins) * 60000L;
                          Datos.upsertRide(this, r);
                          Notif.checkAvisos(this, liveKmValue());
                          d.dismiss();
                          render();
                      });
                      if (editing) {
                          d.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener(y ->
                                  confirmDelete("¿Eliminar este recorrido?",
                                          Datos.fechaHora(existing.start) + " · " + Datos.km2(existing.km) + " km", () -> {
                                              Datos.deleteRide(this, existing.id);
                                              d.dismiss();
                                              render();
                                          }));
                      }
                  });
                  d.show();
              }

              private void baseDialog() {
                  LinearLayout v = dialogBox();
                  v.addView(text("Si tu patineta ya tenía km antes de usar la app, escríbelos aquí. Se suman al total.",
                          14, muted, false));
                  EditText f = field("Ej.: 350", Datos.baseKm(this) > 0 ? Datos.campo(Datos.baseKm(this)) : "", DECIMAL);
                  v.addView(f, lp(-1, -2, 8));
                  new AlertDialog.Builder(this)
                          .setTitle("Km iniciales")
                          .setView(v)
                          .setPositiveButton("Guardar", (d, w) -> {
                              Datos.setBaseKm(this, Datos.num(f.getText().toString()));
                              render();
                          })
                          .setNegativeButton("Cancelar", null)
                          .show();
              }

              /** Crear o editar un aviso por km. */
              private void avisoDialog(Datos.Aviso existing) {
                  final boolean editing = existing != null;
                  final double odo = odoNow();

                  LinearLayout v = dialogBox();
                  v.addView(label("Pieza o tarea"));
                  AutoCompleteTextView name = new AutoCompleteTextView(this);
                  name.setHint("Ej.: Frenos");
                  name.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);
                  String[] sugs = {"Revisión en taller", "Frenos", "Llantas", "Rodamientos", "Tornillería", "Lubricación", "Limpieza general"};
                  name.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_dropdown_item_1line, sugs));
                  name.setThreshold(0);
                  name.setOnFocusChangeListener((x, f) -> { if (f) name.showDropDown(); });
                  name.setOnClickListener(x -> name.showDropDown());
                  if (editing) name.setText(existing.nombre);
                  v.addView(name);

                  v.addView(label("Avisarme cada (km)"));
                  EditText cada = field("Ej.: 300", editing ? Datos.campo(existing.cadaKm) : "", DECIMAL);
                  v.addView(cada);

                  v.addView(label("Último servicio a los (km)"));
                  EditText ult = field("Km de la patineta", Datos.campo(editing ? existing.ultimoKm : odo), DECIMAL);
                  v.addView(ult);
                  v.addView(text("Ahora la patineta tiene " + Datos.km1(odo) + " km.", 12, muted, false), lp(-1, -2, 4));

                  ScrollView sv = new ScrollView(this);
                  sv.addView(v);
                  AlertDialog.Builder b = new AlertDialog.Builder(this)
                          .setTitle(editing ? "Editar aviso" : "Nuevo aviso")
                          .setView(sv)
                          .setPositiveButton("Guardar", null)
                          .setNegativeButton("Cancelar", null);
                  if (editing) b.setNeutralButton("Eliminar", null);
                  AlertDialog d = b.create();
                  d.setOnShowListener(x -> {
                      d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(y -> {
                          String nm = name.getText().toString().trim();
                          double ck = Datos.num(cada.getText().toString());
                          if (TextUtils.isEmpty(nm)) {
                              name.setError("Escribe la pieza o tarea");
                              return;
                          }
                          if (ck <= 0) {
                              cada.setError("Escribe cada cuántos km");
                              return;
                          }
                          Datos.Aviso a = editing ? existing : new Datos.Aviso();
                          if (!editing) a.id = System.currentTimeMillis();
                          a.nombre = nm;
                          a.cadaKm = ck;
                          a.ultimoKm = Datos.num(ult.getText().toString());
                          a.notificado = Datos.nivel(a, odo); // no avisar por algo que ya se sabe
                          Datos.upsertAviso(this, a);
                          d.dismiss();
                          render();
                      });
                      if (editing) {
                          d.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener(y ->
                                  confirmDelete("¿Eliminar este aviso?", existing.nombre, () -> {
                                      Datos.deleteAviso(this, existing.id);
                                      d.dismiss();
                                      render();
                                  }));
                      }
                  });
                  d.show();
              }

              /** Marca un aviso como hecho: reinicia el conteo y deja la anotación en la bitácora. */
              private void avisoHecho(Datos.Aviso a) {
                  final double odo = odoNow();
                  LinearLayout v = dialogBox();
                  v.addView(text("Se marca como hecho a los " + Datos.km1(odo) + " km y se anota en la bitácora.",
                          14, muted, false));
                  EditText costo = field("Costo en pesos (opcional)", "", ENTERO);
                  v.addView(costo, lp(-1, -2, 8));
                  new AlertDialog.Builder(this)
                          .setTitle("Hecho: " + a.nombre)
                          .setView(v)
                          .setPositiveButton("Guardar", (d, w) -> {
                              a.ultimoKm = odo;
                              a.notificado = 0;
                              Datos.upsertAviso(this, a);
                              Datos.Entry e = new Datos.Entry();
                              e.id = System.currentTimeMillis();
                              e.date = System.currentTimeMillis();
                              e.tipo = 0;
                              e.titulo = a.nombre;
                              e.notas = "Hecho por aviso de cada " + Datos.km1(a.cadaKm) + " km";
                              e.km = odo;
                              e.costo = Datos.pesos(costo.getText().toString());
                              Datos.upsertEntry(this, e);
                              render();
                          })
                          .setNegativeButton("Cancelar", null)
                          .show();
              }

              /** Crear o editar una anotación de la bitácora (o un gasto). */
              private void entryDialog(Datos.Entry existing, int defaultTipo) {
                  final boolean editing = existing != null;
                  final Calendar cal = Calendar.getInstance();
                  if (editing) cal.setTimeInMillis(existing.date);

                  LinearLayout v = dialogBox();
                  v.addView(label("Tipo"));
                  Spinner tipo = new Spinner(this);
                  tipo.setAdapter(new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, Datos.TIPOS));
                  tipo.setSelection(editing ? existing.tipo : defaultTipo);
                  v.addView(tipo);

                  v.addView(label("¿Qué hiciste o compraste?"));
                  EditText titulo = field("Ej.: Cambio de llanta trasera", editing ? existing.titulo : "", TEXTO);
                  v.addView(titulo);

                  v.addView(label("Notas (opcional)"));
                  EditText notas = field("Marca, taller, qué falló...", editing ? existing.notas : "",
                          TEXTO | InputType.TYPE_TEXT_FLAG_MULTI_LINE);
                  notas.setMinLines(2);
                  v.addView(notas);

                  v.addView(label("Costo en pesos (opcional)"));
                  EditText costo = field("Ej.: 45000", editing && existing.costo > 0 ? Datos.campo(existing.costo) : "", ENTERO);
                  v.addView(costo);

                  v.addView(label("Fecha"));
                  v.addView(dateButton(cal));

                  v.addView(label("Km de la patineta en ese momento"));
                  EditText kmF = field("Km", Datos.campo(editing ? existing.km : odoNow()), DECIMAL);
                  v.addView(kmF);

                  ScrollView sv = new ScrollView(this);
                  sv.addView(v);
                  AlertDialog.Builder b = new AlertDialog.Builder(this)
                          .setTitle(editing ? "Editar anotación" : "Nueva anotación")
                          .setView(sv)
                          .setPositiveButton("Guardar", null)
                          .setNegativeButton("Cancelar", null);
                  if (editing) b.setNeutralButton("Eliminar", null);
                  AlertDialog d = b.create();
                  d.setOnShowListener(x -> {
                      d.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(y -> {
                          String tt = titulo.getText().toString().trim();
                          if (TextUtils.isEmpty(tt)) {
                              titulo.setError("Escribe qué hiciste o compraste");
                              return;
                          }
                          Datos.Entry e = editing ? existing : new Datos.Entry();
                          if (!editing) e.id = System.currentTimeMillis();
                          e.tipo = tipo.getSelectedItemPosition();
                          e.titulo = tt;
                          e.notas = notas.getText().toString().trim();
                          e.costo = Datos.pesos(costo.getText().toString());
                          e.date = cal.getTimeInMillis();
                          e.km = Datos.num(kmF.getText().toString());
                          Datos.upsertEntry(this, e);
                          d.dismiss();
                          render();
                      });
                      if (editing) {
                          d.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener(y ->
                                  confirmDelete("¿Eliminar esta anotación?", existing.titulo, () -> {
                                      Datos.deleteEntry(this, existing.id);
                                      d.dismiss();
                                      render();
                                  }));
                      }
                  });
                  d.show();
              }
          }
