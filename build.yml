          package com.sebastian.patineta;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Handler;
          import android.os.Looper;

          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.FileReader;
          import java.io.IOException;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.security.MessageDigest;
          import java.util.ArrayList;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.atomic.AtomicInteger;

          /**
           * Guarda en el celular las imágenes del mapa (y los archivos de Leaflet) para poder
           * ver el mapa sin internet. Todo lo que se ve con internet queda guardado, y además
           * se puede descargar de una vez la zona completa de una ruta.
           */
          public class MapCache {
              static final String TILE_URL = "https://a.basemaps.cartocdn.com/light_all/%d/%d/%d.png";
              static final int ZOOM_MIN = 11;
              static final int ZOOM_MAX = 17;
              static final int MAX_TILES = 2500;

              private static final String PREFS = "mapa";

              /** Solo se guardan las direcciones del mapa y de Leaflet. */
              static boolean allowed(String url) {
                  return url.startsWith("https://unpkg.com/") || url.matches("^https://[a-d]\\.basemaps\\.cartocdn\\.com/.*");
              }

              private static String normalize(String url) {
                  return url.replaceFirst("^https://[a-d]\\.basemaps\\.cartocdn\\.com/", "https://basemaps.cartocdn.com/");
              }

              private static File dir(Context c) {
                  File d = new File(c.getFilesDir(), "mapa");
                  if (!d.exists()) d.mkdirs();
                  return d;
              }

              private static String hex(byte[] b) {
                  StringBuilder sb = new StringBuilder();
                  for (byte x : b) sb.append(String.format(Locale.US, "%02x", x));
                  return sb.toString();
              }

              private static File fileFor(Context c, String url) {
                  try {
                      MessageDigest md = MessageDigest.getInstance("SHA-1");
                      String h = hex(md.digest(normalize(url).getBytes("UTF-8")));
                      return new File(dir(c), h);
                  } catch (Exception e) {
                      return new File(dir(c), Integer.toHexString(normalize(url).hashCode()));
                  }
              }

              static boolean has(Context c, String url) {
                  return fileFor(c, url).exists();
              }

              private static byte[] readAll(InputStream in) throws IOException {
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) {
                      out.write(buf, 0, n);
                      if (out.size() > 8 * 1024 * 1024) throw new IOException("archivo muy grande");
                  }
                  return out.toByteArray();
              }

              /** Devuelve el archivo guardado; si no existe y hay internet, lo descarga y lo guarda. */
              static byte[] get(Context c, String url) {
                  File f = fileFor(c, url);
                  try {
                      if (f.exists()) {
                          try (FileInputStream in = new FileInputStream(f)) {
                              return readAll(in);
                          }
                      }
                      HttpURLConnection con = (HttpURLConnection) new URL(url).openConnection();
                      con.setConnectTimeout(10000);
                      con.setReadTimeout(15000);
                      con.setRequestProperty("User-Agent", "Patineta/1.0 (app personal)");
                      if (con.getResponseCode() != 200) {
                          con.disconnect();
                          return null;
                      }
                      byte[] data;
                      try (InputStream in = con.getInputStream()) {
                          data = readAll(in);
                      } finally {
                          con.disconnect();
                      }
                      File tmp = new File(f.getParentFile(), f.getName() + ".tmp");
                      try (FileOutputStream out = new FileOutputStream(tmp)) {
                          out.write(data);
                      }
                      if (!tmp.renameTo(f)) tmp.delete();
                      return data;
                  } catch (Exception e) {
                      return null;
                  }
              }

              static String mime(String url) {
                  String u = url.toLowerCase(Locale.US);
                  int q = u.indexOf('?');
                  if (q > 0) u = u.substring(0, q);
                  if (u.endsWith(".js")) return "application/javascript";
                  if (u.endsWith(".css")) return "text/css";
                  if (u.endsWith(".png")) return "image/png";
                  if (u.endsWith(".svg")) return "image/svg+xml";
                  return "application/octet-stream";
              }

              // ------------------------------------------------------------------ Zona de la ruta
              /** Puntos [lat, lon] de un archivo de ruta. */
              static List<double[]> puntos(File f) {
                  List<double[]> list = new ArrayList<>();
                  if (!f.exists()) return list;
                  try (BufferedReader r = new BufferedReader(new FileReader(f))) {
                      String s;
                      while ((s = r.readLine()) != null) {
                          int i = s.indexOf(',');
                          if (i <= 0) continue;
                          try {
                              list.add(new double[]{Double.parseDouble(s.substring(0, i).trim()),
                                      Double.parseDouble(s.substring(i + 1).trim())});
                          } catch (NumberFormatException ignored) { }
                      }
                  } catch (IOException ignored) { }
                  return list;
              }

              private static int tileX(double lon, int z) {
                  int n = 1 << z;
                  int x = (int) Math.floor((lon + 180.0) / 360.0 * n);
                  return Math.max(0, Math.min(n - 1, x));
              }

              private static int tileY(double lat, int z) {
                  int n = 1 << z;
                  double r = Math.toRadians(Math.max(-85.0, Math.min(85.0, lat)));
                  int y = (int) Math.floor((1.0 - Math.log(Math.tan(r) + 1.0 / Math.cos(r)) / Math.PI) / 2.0 * n);
                  return Math.max(0, Math.min(n - 1, y));
              }

              /** Direcciones de todas las imágenes que cubren la ruta (y un margen alrededor). */
              static List<String> urlsPara(List<double[]> pts) {
                  for (int zmax = ZOOM_MAX; zmax >= ZOOM_MIN; zmax--) {
                      Set<String> set = new LinkedHashSet<>();
                      for (int z = ZOOM_MIN; z <= zmax; z++) {
                          int n = 1 << z;
                          for (double[] p : pts) {
                              int cx = tileX(p[1], z), cy = tileY(p[0], z);
                              for (int dx = -1; dx <= 1; dx++) {
                                  for (int dy = -1; dy <= 1; dy++) {
                                      int x = cx + dx, y = cy + dy;
                                      if (x < 0 || y < 0 || x >= n || y >= n) continue;
                                      set.add(String.format(Locale.US, TILE_URL, z, x, y));
                                  }
                              }
                          }
                      }
                      if (set.size() <= MAX_TILES || zmax == ZOOM_MIN) return new ArrayList<>(set);
                  }
                  return new ArrayList<>();
              }

              // ------------------------------------------------------------------ Descarga
              interface Listener {
                  void onProgress(int done, int total);

                  void onDone(int total, int failed);
              }

              static class Job {
                  volatile boolean cancelled = false;

                  void cancel() {
                      cancelled = true;
                  }
              }

              /** Descarga las imágenes que falten (3 a la vez). Los avisos llegan en el hilo principal. */
              static Job download(final Context app, final List<String> urls, final Listener l) {
                  final Job job = new Job();
                  final Handler main = new Handler(Looper.getMainLooper());
                  final int total = urls.size();
                  final AtomicInteger done = new AtomicInteger(0);
                  final AtomicInteger failed = new AtomicInteger(0);
                  final ExecutorService ex = Executors.newFixedThreadPool(3);
                  if (total == 0) {
                      main.post(() -> l.onDone(0, 0));
                      ex.shutdown();
                      return job;
                  }
                  for (final String u : urls) {
                      ex.execute(() -> {
                          if (!job.cancelled) {
                              if (!has(app, u) && get(app, u) == null) failed.incrementAndGet();
                          }
                          final int d = done.incrementAndGet();
                          if (job.cancelled) return;
                          if (d == total) {
                              main.post(() -> {
                                  if (!job.cancelled) l.onDone(total, failed.get());
                              });
                          } else if (d % 5 == 0) {
                              main.post(() -> {
                                  if (!job.cancelled) l.onProgress(d, total);
                              });
                          }
                      });
                  }
                  ex.shutdown();
                  return job;
              }

              // ------------------------------------------------------------------ Información
              static String info(Context c) {
                  return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString("info", "Mapa guardado en el celular");
              }

              static void saveInfo(Context c) {
                  File[] fs = dir(c).listFiles();
                  long bytes = 0;
                  int n = 0;
                  if (fs != null) {
                      for (File f : fs) {
                          if (f.getName().endsWith(".tmp")) continue;
                          bytes += f.length();
                          n++;
                      }
                  }
                  String s = "Mapa guardado: " + n + " imágenes (" + String.format(Locale.US, "%.1f", bytes / 1048576.0) + " MB)";
