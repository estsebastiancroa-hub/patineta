                  web.evaluateJavascript("update(" + json + "," + live + "," + ref + ");", null);
              }

              // ------------------------------------------------------------------ Guardar sin internet
              private void onGuardar() {
                  if (MapCache.puntos(ruta).size() < 2) {
                      Toast.makeText(this, "Esta ruta no tiene puntos para guardar", Toast.LENGTH_LONG).show();
                      return;
                  }
                  if (!daily && Datos.rutaDiaria(this).exists()) {
                      new AlertDialog.Builder(this)
                              .setTitle("¿Reemplazar tu ruta diaria?")
                              .setMessage("Ya tienes una ruta diaria guardada. Esta la va a reemplazar.")
                              .setPositiveButton("Reemplazar", (d, w) -> guardar())
                              .setNegativeButton("Cancelar", null)
                              .show();
                  } else {
                      guardar();
                  }
              }

              private void guardar() {
                  if (!daily) Datos.copiar(ruta, Datos.rutaDiaria(this));
                  List<double[]> pts = MapCache.puntos(Datos.rutaDiaria(this));
                  List<String> urls = MapCache.urlsPara(pts);
                  if (job != null) job.cancel();
                  status.setVisibility(View.VISIBLE);
                  status.setText("Guardando el mapa de la zona... 0 / " + urls.size()
                          + "\nDeja esta pantalla abierta y con internet.");
                  job = MapCache.download(getApplicationContext(), urls, new MapCache.Listener() {
                      @Override
                      public void onProgress(int done, int total) {
                          status.setText("Guardando el mapa de la zona... " + done + " / " + total
                                  + "\nDeja esta pantalla abierta y con internet.");
                      }

                      @Override
                      public void onDone(int total, int failed) {
                          MapCache.saveInfo(getApplicationContext());
                          if (failed == 0) {
                              status.setText("Listo: tu ruta diaria y su mapa ya funcionan sin internet.");
                          } else {
                              status.setText("Se guardó casi todo, pero faltaron " + failed
                                      + " imágenes por falta de internet. Toca \"Descargar de nuevo\" para completar.");
                          }
                          if (ready) {
                              handler.removeCallbacks(refresh);
                              handler.post(refresh);
                          }
                      }
                  });
              }

              // ------------------------------------------------------------------ Ciclo de vida
              @Override
              protected void onResume() {
                  super.onResume();
                  if (ready) {
                      handler.removeCallbacks(refresh);
                      handler.post(refresh);
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  handler.removeCallbacks(refresh);
              }

              @Override
              protected void onDestroy() {
                  handler.removeCallbacks(refresh);
                  if (job != null) job.cancel();
                  if (web != null) {
                      web.destroy();
                      web = null;
                  }
                  super.onDestroy();
              }
          }
