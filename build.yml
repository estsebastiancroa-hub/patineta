# Patineta - compila la app de Android y publica el APK para descargar.
# Este archivo contiene TODO el código de la app: GitHub lo arma y genera el APK.
name: Construir APK de Patineta

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Crear el proyecto de la app
        run: |
          mkdir -p app
          cat > app/build.gradle <<'EOF_PATINETA'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.sebastian.patineta'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.sebastian.patineta'
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName '1.2'
              }

              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_PATINETA
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_PATINETA'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.INTERNET" />

              <uses-feature android:name="android.hardware.location.gps" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="Patineta"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".MapaActivity"
                      android:exported="false" />

                  <service
                      android:name=".TrackService"
                      android:exported="false"
                      android:foregroundServiceType="location" />
              </application>
          </manifest>
          EOF_PATINETA
          mkdir -p app/src/main/java/com/sebastian/patineta
          cat > app/src/main/java/com/sebastian/patineta/Datos.java <<'EOF_PATINETA'
          package com.sebastian.patineta;

          import android.content.Context;
          import android.content.SharedPreferences;

          import org.json.JSONArray;
          import org.json.JSONException;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;
          import java.io.IOException;
          import java.text.NumberFormat;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          /** Datos de la app (recorridos, anotaciones y avisos) + utilidades de formato. */
          public class Datos {
              public static final Locale ES = new Locale("es", "CO");
              private static final String PREFS = "patineta";

              public static final String[] TIPOS = {"Mantenimiento", "Reparación", "Cambio de pieza", "Compra", "Accesorio", "Otro"};

              // ---------------------------------------------------------------- Modelos
              public abstract static class Item {
                  public long id;
                  abstract JSONObject toJson() throws JSONException;
              }

              /** Un recorrido (con GPS o escrito a mano). */
              public static class Ride extends Item {
                  public long start;
                  public long durMs;
                  public double km;
                  public boolean manual;

                  JSONObject toJson() throws JSONException {
                      JSONObject o = new JSONObject();
                      o.put("id", id);
                      o.put("start", start);
                      o.put("durMs", durMs);
                      o.put("km", km);
                      o.put("manual", manual);
                      return o;
                  }

                  static Ride fromJson(JSONObject o) {
                      Ride r = new Ride();
                      r.id = o.optLong("id");
                      r.start = o.optLong("start");
                      r.durMs = o.optLong("durMs");
                      r.km = o.optDouble("km", 0);
                      r.manual = o.optBoolean("manual", false);
                      return r;
                  }
              }

              /** Una anotación de la bitácora (reparación, cambio, compra...). */
              public static class Entry extends Item {
                  public long date;
                  public int tipo;
                  public String titulo = "";
                  public String notas = "";
                  public double costo;
                  public double km;

                  JSONObject toJson() throws JSONException {
                      JSONObject o = new JSONObject();
                      o.put("id", id);
                      o.put("date", date);
                      o.put("tipo", tipo);
                      o.put("titulo", titulo);
                      o.put("notas", notas);
                      o.put("costo", costo);
                      o.put("km", km);
                      return o;
                  }

                  static Entry fromJson(JSONObject o) {
                      Entry e = new Entry();
                      e.id = o.optLong("id");
                      e.date = o.optLong("date");
                      e.tipo = o.optInt("tipo", 0);
                      if (e.tipo < 0 || e.tipo >= TIPOS.length) e.tipo = TIPOS.length - 1;
                      e.titulo = o.optString("titulo", "");
                      e.notas = o.optString("notas", "");
                      e.costo = o.optDouble("costo", 0);
                      e.km = o.optDouble("km", 0);
                      return e;
                  }
              }

              /** Un aviso por km: "Frenos cada 300 km". */
              public static class Aviso extends Item {
                  public String nombre = "";
                  public double cadaKm;
                  public double ultimoKm;   // km de la patineta cuando se hizo por última vez
                  public int notificado;    // 0 nada, 1 "pronto", 2 "toca"

                  JSONObject toJson() throws JSONException {
                      JSONObject o = new JSONObject();
                      o.put("id", id);
                      o.put("nombre", nombre);
                      o.put("cadaKm", cadaKm);
                      o.put("ultimoKm", ultimoKm);
                      o.put("notificado", notificado);
                      return o;
                  }

                  static Aviso fromJson(JSONObject o) {
                      Aviso a = new Aviso();
                      a.id = o.optLong("id");
                      a.nombre = o.optString("nombre", "");
                      a.cadaKm = o.optDouble("cadaKm", 0);
                      a.ultimoKm = o.optDouble("ultimoKm", 0);
                      a.notificado = o.optInt("notificado", 0);
                      return a;
                  }
              }

              /** 0 = al día, 1 = pronto (falta menos del 10 %), 2 = ya toca. */
              public static int nivel(Aviso a, double odo) {
                  double falta = a.ultimoKm + a.cadaKm - odo;
                  if (falta <= 0) return 2;
                  if (falta <= a.cadaKm * 0.1) return 1;
                  return 0;
              }

              public static double falta(Aviso a, double odo) {
                  return a.ultimoKm + a.cadaKm - odo;
              }

              // ------------------------------------------------------------ Almacenamiento
              private interface Maker<T> {
                  T make(JSONObject o);
              }

              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              private static <T extends Item> List<T> load(Context c, String key, Maker<T> m) {
                  List<T> list = new ArrayList<>();
                  try {
                      JSONArray a = new JSONArray(p(c).getString(key, "[]"));
                      for (int i = 0; i < a.length(); i++) list.add(m.make(a.getJSONObject(i)));
                  } catch (JSONException ignored) { }
                  return list;
              }

              private static <T extends Item> void save(Context c, String key, List<T> list) {
                  JSONArray a = new JSONArray();
                  try {
                      for (T t : list) a.put(t.toJson());
                  } catch (JSONException ignored) { }
                  p(c).edit().putString(key, a.toString()).apply();
              }

              private static <T extends Item> void upsert(List<T> list, T x) {
                  for (int i = 0; i < list.size(); i++) {
                      if (list.get(i).id == x.id) {
                          list.set(i, x);
                          return;
                      }
                  }
                  list.add(x);
              }

              private static void removeId(List<? extends Item> list, long id) {
                  for (int i = 0; i < list.size(); i++) {
                      if (list.get(i).id == id) {
                          list.remove(i);
                          return;
                      }
                  }
              }

              public static List<Ride> loadRides(Context c) { return load(c, "rides", Ride::fromJson); }

              public static void upsertRide(Context c, Ride r) {
                  List<Ride> l = loadRides(c);
                  upsert(l, r);
                  save(c, "rides", l);
              }

              public static void deleteRide(Context c, long id) {
                  List<Ride> l = loadRides(c);
                  removeId(l, id);
                  save(c, "rides", l);
                  rutaFile(c, id).delete();
              }

              // ------------------------------------------------------------------ Rutas (mapa)
              /** Ruta del recorrido en curso. */
              public static File rutaActual(Context c) {
                  return new File(c.getFilesDir(), "ruta_actual.txt");
              }

              /** Ruta guardada de un recorrido terminado. */
              public static File rutaFile(Context c, long rideId) {
                  return new File(c.getFilesDir(), "ruta_" + rideId + ".txt");
              }

              /** La ruta que haces todos los días (guardada para usarla sin internet). */
              public static File rutaDiaria(Context c) {
                  return new File(c.getFilesDir(), "ruta_diaria.txt");
              }

              public static void copiar(File from, File to) {
                  try (java.io.FileInputStream in = new java.io.FileInputStream(from);
                       java.io.FileOutputStream out = new java.io.FileOutputStream(to)) {
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                  } catch (IOException ignored) { }
              }

              /** Agrega una línea a la ruta: "S" = tramo nuevo, o "lat,lon". */
              public static void rutaAppend(File f, String line) {
                  try (FileWriter w = new FileWriter(f, true)) {
                      w.write(line + "\n");
                  } catch (IOException ignored) { }
              }

              /** Lee la ruta y la devuelve como JSON: [[[lat,lon],...],[...]] (un arreglo por tramo). */
              public static String rutaJson(File f) {
                  List<List<String>> segs = new ArrayList<>();
                  if (f.exists()) {
                      try (BufferedReader r = new BufferedReader(new FileReader(f))) {
                          String s;
                          while ((s = r.readLine()) != null) {
                              s = s.trim();
                              if (s.isEmpty()) continue;
                              if (s.equals("S")) {
                                  segs.add(new ArrayList<String>());
                              } else if (s.indexOf(',') > 0) {
                                  if (segs.isEmpty()) segs.add(new ArrayList<String>());
                                  segs.get(segs.size() - 1).add(s);
                              }
                          }
                      } catch (IOException ignored) { }
                  }
                  int total = 0;
                  for (List<String> g : segs) total += g.size();
                  int paso = Math.max(1, total / 3000); // si hay demasiados puntos, deja uno de cada "paso"
                  StringBuilder sb = new StringBuilder("[");
                  boolean firstSeg = true;
                  for (List<String> g : segs) {
                      if (g.isEmpty()) continue;
                      if (!firstSeg) sb.append(',');
                      firstSeg = false;
                      sb.append('[');
                      for (int i = 0; i < g.size(); i++) {
                          if (i % paso != 0 && i != g.size() - 1) continue;
                          if (sb.charAt(sb.length() - 1) != '[') sb.append(',');
                          sb.append('[').append(g.get(i)).append(']');
                      }
                      sb.append(']');
                  }
                  return sb.append(']').toString();
              }

              public static List<Entry> loadEntries(Context c) { return load(c, "entries", Entry::fromJson); }

              public static void upsertEntry(Context c, Entry e) {
                  List<Entry> l = loadEntries(c);
                  upsert(l, e);
                  save(c, "entries", l);
              }

              public static void deleteEntry(Context c, long id) {
                  List<Entry> l = loadEntries(c);
                  removeId(l, id);
                  save(c, "entries", l);
              }

              public static List<Aviso> loadAvisos(Context c) { return load(c, "avisos", Aviso::fromJson); }

              public static void upsertAviso(Context c, Aviso a) {
                  List<Aviso> l = loadAvisos(c);
                  upsert(l, a);
                  save(c, "avisos", l);
              }

              public static void deleteAviso(Context c, long id) {
                  List<Aviso> l = loadAvisos(c);
                  removeId(l, id);
                  save(c, "avisos", l);
              }

              public static void saveAvisos(Context c, List<Aviso> l) { save(c, "avisos", l); }

              /** Km que ya tenía la patineta antes de empezar a usar la app. */
              public static double baseKm(Context c) {
                  try {
                      return Double.parseDouble(p(c).getString("baseKm", "0"));
                  } catch (NumberFormatException e) {
                      return 0;
                  }
              }

              public static void setBaseKm(Context c, double v) {
                  p(c).edit().putString("baseKm", Double.toString(v)).apply();
              }

              /** Km totales de la patineta = km iniciales + todos los recorridos guardados. */
              public static double odometer(Context c) {
                  double t = baseKm(c);
                  for (Ride r : loadRides(c)) t += r.km;
                  return t;
              }

              // ------------------------------------------------------------------ Formato
              public static String km1(double v) {
                  return String.format(ES, "%,.1f", v);
              }

              public static String km2(double v) {
                  return String.format(ES, "%,.2f", v);
              }

              /** Número para mostrar dentro de un campo de texto (sin separador de miles). */
              public static String campo(double v) {
                  String s = String.format(Locale.US, "%.2f", v);
                  if (s.endsWith(".00")) s = s.substring(0, s.length() - 3);
                  else if (s.endsWith("0")) s = s.substring(0, s.length() - 1);
                  return s;
              }

              public static String money(double v) {
                  return "$ " + NumberFormat.getIntegerInstance(ES).format(Math.round(v));
              }

              /** Cronómetro: 12:05 o 1:02:33. */
              public static String clock(long ms) {
                  long s = ms / 1000;
                  long h = s / 3600, m = (s % 3600) / 60, sec = s % 60;
                  if (h > 0) return String.format(ES, "%d:%02d:%02d", h, m, sec);
                  return String.format(ES, "%02d:%02d", m, sec);
              }

              /** Duración corta: 42 min o 1 h 05 min. */
              public static String dur(long ms) {
                  long min = Math.round(ms / 60000.0);
                  if (min < 60) return min + " min";
                  return (min / 60) + " h " + String.format(ES, "%02d", min % 60) + " min";
              }

              public static String fechaHora(long ms) {
                  return new SimpleDateFormat("EEE d MMM · h:mm a", ES).format(new Date(ms));
              }

              public static String fecha(long ms) {
                  return new SimpleDateFormat("d MMM yyyy", ES).format(new Date(ms));
              }

              public static String fechaLarga(long ms) {
                  return new SimpleDateFormat("EEE d 'de' MMMM yyyy", ES).format(new Date(ms));
              }

              public static String hoy() {
                  return new SimpleDateFormat("EEEE d 'de' MMMM", ES).format(new Date()).toUpperCase(ES);
              }

              /** Lee un número que puede venir con coma o punto decimal. */
              public static double num(String s) {
                  if (s == null) return 0;
                  s = s.trim();
                  if (s.isEmpty()) return 0;
                  if (s.contains(",")) s = s.replace(".", "").replace(",", ".");
                  try {
                      double v = Double.parseDouble(s);
                      return (Double.isNaN(v) || Double.isInfinite(v) || v < 0) ? 0 : v;
                  } catch (NumberFormatException e) {
                      return 0;
                  }
              }

              /** Lee dinero en pesos: acepta "25000" o "25.000". */
              public static double pesos(String s) {
                  if (s == null) return 0;
                  String d = s.replaceAll("[^0-9]", "");
                  if (d.isEmpty() || d.length() > 12) return 0;
                  return Double.parseDouble(d);
              }

              // ------------------------------------------------------------------- Fechas
              private static Calendar hoyInicio() {
                  Calendar c = Calendar.getInstance();
                  c.set(Calendar.HOUR_OF_DAY, 0);
                  c.set(Calendar.MINUTE, 0);
                  c.set(Calendar.SECOND, 0);
                  c.set(Calendar.MILLISECOND, 0);
                  return c;
              }

              public static long inicioSemana() {
                  Calendar c = hoyInicio();
                  c.setFirstDayOfWeek(Calendar.MONDAY);
                  int dow = c.get(Calendar.DAY_OF_WEEK); // domingo = 1 ... sábado = 7
                  int atras = (dow + 5) % 7;             // lunes = 0 ... domingo = 6
                  c.add(Calendar.DAY_OF_YEAR, -atras);
                  return c.getTimeInMillis();
              }

              public static long inicioMes() {
                  Calendar c = hoyInicio();
                  c.set(Calendar.DAY_OF_MONTH, 1);
                  return c.getTimeInMillis();
              }

              public static long inicioAnio() {
                  Calendar c = hoyInicio();
                  c.set(Calendar.DAY_OF_YEAR, 1);
                  return c.getTimeInMillis();
              }
          }
          EOF_PATINETA
          mkdir -p app/src/main/java/com/sebastian/patineta
          cat > app/src/main/java/com/sebastian/patineta/Notif.java <<'EOF_PATINETA'
          package com.sebastian.patineta;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;

          import java.util.List;

          /** Canales y notificaciones de la app. */
          public class Notif {
              static final String CH_AVISOS = "avisos";
              static final String CH_REC = "recorrido";

              static void channels(Context c) {
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  if (nm.getNotificationChannel(CH_AVISOS) == null) {
                      NotificationChannel ch = new NotificationChannel(CH_AVISOS, "Avisos de mantenimiento",
                              NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("Te avisa cuando toca revisar o llevar la patineta al taller");
                      nm.createNotificationChannel(ch);
                  }
                  if (nm.getNotificationChannel(CH_REC) == null) {
                      NotificationChannel ch = new NotificationChannel(CH_REC, "Recorrido en curso",
                              NotificationManager.IMPORTANCE_LOW);
                      ch.setDescription("Se muestra mientras la app mide los km con el GPS");
                      nm.createNotificationChannel(ch);
                  }
              }

              static boolean canNotify(Context c) {
                  return Build.VERSION.SDK_INT < 33
                          || c.checkSelfPermission("android.permission.POST_NOTIFICATIONS") == PackageManager.PERMISSION_GRANTED;
              }

              static void aviso(Context c, int id, String title, String text) {
                  if (!canNotify(c)) return;
                  channels(c);
                  Intent open = new Intent(c, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(c, 0, open,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(c, CH_AVISOS)
                          .setSmallIcon(android.R.drawable.ic_popup_reminder)
                          .setColor(Color.parseColor("#111111"))
                          .setContentTitle(title)
                          .setContentText(text)
                          .setStyle(new Notification.BigTextStyle().bigText(text))
                          .setContentIntent(pi)
                          .setAutoCancel(true)
                          .build();
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null) nm.notify(id, n);
              }

              /**
               * Revisa los avisos por km. Si alguno acaba de pasar a "pronto" o "toca",
               * manda la notificación (una sola vez por etapa).
               * extraKm = km del recorrido que todavía no se ha guardado.
               */
              static void checkAvisos(Context c, double extraKm) {
                  double odo = Datos.odometer(c) + extraKm;
                  List<Datos.Aviso> list = Datos.loadAvisos(c);
                  boolean changed = false;
                  for (Datos.Aviso a : list) {
                      int lv = Datos.nivel(a, odo);
                      if (lv > a.notificado) {
                          a.notificado = lv;
                          changed = true;
                          double falta = Datos.falta(a, odo);
                          int nid = 5000 + (int) (a.id % 100000L);
                          if (lv == 2) {
                              aviso(c, nid, "Toca: " + a.nombre,
                                      "Ya pasaron " + Datos.km1(a.cadaKm) + " km desde el último servicio. Llévala al taller o hazle el mantenimiento.");
                          } else {
                              aviso(c, nid, "Pronto toca: " + a.nombre,
                                      "Faltan " + Datos.km1(falta) + " km para el próximo servicio.");
                          }
                      }
                  }
                  if (changed) Datos.saveAvisos(c, list);
              }
          }
          EOF_PATINETA
          mkdir -p app/src/main/java/com/sebastian/patineta
          cat > app/src/main/java/com/sebastian/patineta/TrackService.java <<'EOF_PATINETA'
          package com.sebastian.patineta;

          import android.app.Notification;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ServiceInfo;
          import android.graphics.Color;
          import android.graphics.drawable.Icon;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.widget.Toast;

          import java.util.Locale;

          /** Mide los km con el GPS aunque la pantalla esté apagada (servicio en primer plano). */
          public class TrackService extends Service implements LocationListener {
              public static final String ACT_START = "com.sebastian.patineta.START";
              public static final String ACT_PAUSE = "com.sebastian.patineta.PAUSE";
              public static final String ACT_RESUME = "com.sebastian.patineta.RESUME";
              public static final String ACT_FINISH = "com.sebastian.patineta.FINISH";

              private static final int NID = 77;
              private static final String PREFS = "recorrido";

              // Estado que lee la pantalla principal
              static volatile boolean alive = false;
              static volatile int state = 0;        // 0 sin recorrido, 1 grabando, 2 en pausa
              static volatile double meters = 0;
              static volatile long activeMs = 0;    // tiempo de los tramos ya cerrados
              static volatile long runStart = 0;    // reloj cuando empezó el tramo actual
              static volatile long startWall = 0;   // hora real en que empezó el recorrido

              private LocationManager lm;
              private Location last;
              private long lastNotifyAt = 0;
              private int lastBucket = 0;

              /** Tiempo en movimiento del recorrido (incluye el tramo que está corriendo). */
              static long activeNow() {
                  if (state == 1) return activeMs + (SystemClock.elapsedRealtime() - runStart);
                  return activeMs;
              }

              /** Si la app se cerró en medio de un recorrido, lo recupera en pausa. */
              static void restore(Context c) {
                  if (alive || state != 0) return;
                  SharedPreferences p = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
                  if (p.getInt("state", 0) == 0) return;
                  meters = Double.longBitsToDouble(p.getLong("meters", 0L));
                  activeMs = p.getLong("active", 0L);
                  startWall = p.getLong("start", System.currentTimeMillis());
                  runStart = 0;
                  state = 2;
              }

              private void persist() {
                  SharedPreferences.Editor e = getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit();
                  e.putInt("state", state);
                  e.putLong("meters", Double.doubleToRawLongBits(meters));
                  e.putLong("active", activeNow());
                  e.putLong("start", startWall);
                  e.apply();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  Notif.channels(this);
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String a = intent == null ? null : intent.getAction();
                  if (a == null) {
                      stopSelf();
                      return START_NOT_STICKY;
                  }
                  switch (a) {
                      case ACT_START:
                          if (state == 0) {
                              meters = 0;
                              activeMs = 0;
                              startWall = System.currentTimeMillis();
                              lastBucket = 0;
                              Datos.rutaActual(this).delete(); // empieza una ruta nueva
                          }
                          if (state != 1) beginRun(); else startFg();
                          break;
                      case ACT_RESUME:
                          if (state != 1) beginRun(); else startFg();
                          break;
                      case ACT_PAUSE:
                          if (state == 1) pauseRun();
                          break;
                      case ACT_FINISH:
                          finishRide();
                          break;
                      default:
                          break;
                  }
                  return START_NOT_STICKY;
              }

              private void startFg() {
                  Notification n = buildNotif();
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(NID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_LOCATION);
                      } else {
                          startForeground(NID, n);
                      }
                      alive = true;
                  } catch (SecurityException e) {
                      Toast.makeText(this, "Falta el permiso de ubicación", Toast.LENGTH_LONG).show();
                      state = state == 1 ? 2 : state;
                      stopSelf();
                  }
              }

              private void beginRun() {
                  startFg();
                  if (!alive) return;
                  try {
                      last = null;
                      runStart = SystemClock.elapsedRealtime();
                      state = 1;
                      lm.requestLocationUpdates(LocationManager.GPS_PROVIDER, 2000L, 0f, this, Looper.getMainLooper());
                  } catch (SecurityException | IllegalArgumentException e) {
                      state = state == 1 ? 2 : state;
                      Toast.makeText(this, "No pude usar el GPS. Revisa el permiso de ubicación.", Toast.LENGTH_LONG).show();
                  }
                  persist();
                  updateNotif();
              }

              private void pauseRun() {
                  activeMs += SystemClock.elapsedRealtime() - runStart;
                  state = 2;
                  lm.removeUpdates(this);
                  last = null;
                  persist();
                  updateNotif();
              }

              private void finishRide() {
                  if (state == 1) activeMs += SystemClock.elapsedRealtime() - runStart;
                  lm.removeUpdates(this);
                  int before = state;
                  double km = meters / 1000.0;
                  long dur = activeMs;
                  long start = startWall;
                  state = 0;
                  meters = 0;
                  activeMs = 0;
                  runStart = 0;
                  last = null;
                  persist(); // con state = 0 limpia el recorrido guardado

                  if (before != 0) {
                      if (km >= 0.02) {
                          Datos.Ride r = new Datos.Ride();
                          r.id = System.currentTimeMillis();
                          r.start = start;
                          r.durMs = dur;
                          r.km = km;
                          r.manual = false;
                          Datos.upsertRide(this, r);
                          // la ruta del mapa queda guardada con el recorrido
                          Datos.rutaActual(this).renameTo(Datos.rutaFile(this, r.id));
                          Notif.checkAvisos(this, 0);
                          Toast.makeText(this, "Recorrido guardado: " + Datos.km2(km) + " km", Toast.LENGTH_LONG).show();
                      } else {
                          Datos.rutaActual(this).delete();
                          Toast.makeText(this, "Recorrido muy corto, no se guardó", Toast.LENGTH_SHORT).show();
                      }
                  }
                  stopForeground(Service.STOP_FOREGROUND_REMOVE);
                  alive = false;
                  stopSelf();
              }

              @Override
              public void onDestroy() {
                  if (lm != null) lm.removeUpdates(this);
                  if (state == 1) { // el sistema cerró el servicio: dejo el recorrido en pausa
                      activeMs += SystemClock.elapsedRealtime() - runStart;
                      state = 2;
                      persist();
                  }
                  alive = false;
                  super.onDestroy();
              }

              // ------------------------------------------------------------------ GPS
              @Override
              public void onLocationChanged(Location l) {
                  if (state != 1) return;
                  if (l.hasAccuracy() && l.getAccuracy() > 30f) return; // señal mala
                  if (last == null) {
                      last = l;
                      // primer punto del tramo para el mapa
                      Datos.rutaAppend(Datos.rutaActual(this), "S");
                      Datos.rutaAppend(Datos.rutaActual(this), punto(l));
                      return;
                  }
                  float d = last.distanceTo(l);
                  long dtNs = l.getElapsedRealtimeNanos() - last.getElapsedRealtimeNanos();
                  if (dtNs <= 0) return;
                  double v = d / (dtNs / 1e9);
                  if (v > 25) return; // salto raro del GPS (más de 90 km/h)
                  float minMove = Math.max(3f, l.hasAccuracy() ? l.getAccuracy() / 2f : 3f);
                  if (d < minMove) return; // quieto: es solo ruido del GPS
                  meters += d;
                  last = l;
                  Datos.rutaAppend(Datos.rutaActual(this), punto(l));
                  persist();

                  int bucket = (int) (meters / 250.0);
                  if (bucket != lastBucket) {
                      lastBucket = bucket;
                      Notif.checkAvisos(this, meters / 1000.0);
                  }
                  long now = SystemClock.elapsedRealtime();
                  if (now - lastNotifyAt > 4000) {
                      lastNotifyAt = now;
                      updateNotif();
                  }
              }

              private static String punto(Location l) {
                  return String.format(Locale.US, "%.5f,%.5f", l.getLatitude(), l.getLongitude());
              }

              @Override
              public void onStatusChanged(String provider, int status, Bundle extras) { }

              @Override
              public void onProviderEnabled(String provider) { }

              @Override
              public void onProviderDisabled(String provider) { }

              // --------------------------------------------------------- Notificación
              private PendingIntent action(String act, int code) {
                  Intent i = new Intent(this, TrackService.class);
                  i.setAction(act);
                  return PendingIntent.getService(this, code, i,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              private Notification buildNotif() {
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open,
                          PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  boolean running = state == 1;
                  String title = running ? "Grabando recorrido" : "Recorrido en pausa";
                  String text = Datos.km2(meters / 1000.0) + " km · " + Datos.clock(activeNow());
                  Notification.Action toggle = new Notification.Action.Builder(
                          Icon.createWithResource(this, running ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play),
                          running ? "Pausar" : "Reanudar",
                          action(running ? ACT_PAUSE : ACT_RESUME, 1)).build();
                  Notification.Action finish = new Notification.Action.Builder(
                          Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel),
                          "Terminar",
                          action(ACT_FINISH, 2)).build();
                  return new Notification.Builder(this, Notif.CH_REC)
                          .setSmallIcon(android.R.drawable.ic_menu_mylocation)
                          .setColor(Color.parseColor("#111111"))
                          .setContentTitle(title)
                          .setContentText(text)
                          .setContentIntent(pi)
                          .setOngoing(true)
                          .setOnlyAlertOnce(true)
                          .addAction(toggle)
                          .addAction(finish)
                          .build();
              }

              private void updateNotif() {
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm != null && alive) nm.notify(NID, buildNotif());
              }
          }
