                      + "layer.clearLayers();"
                      + "var c=NIGHT?'#F2F2F2':'#111111';var inv=NIGHT?'#0A0A0A':'#FFFFFF';var all=[];"
                      + "for(var k=0;k<ref.length;k++){if(ref[k].length>1){"
